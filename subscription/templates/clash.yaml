port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
{% for node in nodes %}
  - name: {{ node.name }}
    type: vless
    server: {{ node.host }}
    port: {{ node.port }}
    uuid: {{ node.uuid }}
    cipher: none
    tls: false
    network: tcp
{% endfor %}

proxy-groups:
  - name: Auto
    type: url-test
    proxies:
{% for node in nodes %}
      - {{ node.name }}
{% endfor %}
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: Fallback
    type: fallback
    proxies:
{% for node in nodes %}
      - {{ node.name }}
{% endfor %}
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: Select
    type: select
    proxies:
      - Auto
      - Fallback
{% for node in nodes %}
      - {{ node.name }}
{% endfor %}

rules:
  - MATCH,Select